<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>同じ廊下</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Virtual Joystick (left) -->
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>

    <!-- Settings button (top-right, safe area) -->
    <button id="settings-btn" type="button" aria-label="設定">⚙</button>

    <!-- 調査ボタン -->
    <button id="action-btn" type="button" class="hidden" aria-label="調べる">調べる</button>

    <!-- ダッシュ -->
    <button id="dash-btn" type="button" aria-label="ダッシュ">走</button>

    <!-- 体力バー -->
    <div id="stamina-wrap">
      <div id="stamina-bar"><div id="stamina-fill"></div></div>
    </div>

    <!-- 調査メッセージ -->
    <div id="message-panel" class="hidden">
      <div id="message-text"></div>
      <button id="message-close" type="button">閉じる</button>
      <button id="message-next" type="button" class="hidden">次へ</button>
    </div>

    <!-- 金庫暗証番号 -->
    <div id="pin-panel" class="hidden">
      <div id="pin-card">
        <div id="pin-title">暗証番号</div>
        <div id="pin-display">----</div>
        <div id="pin-pad">
          <button type="button" data-pin="1">1</button>
          <button type="button" data-pin="2">2</button>
          <button type="button" data-pin="3">3</button>
          <button type="button" data-pin="4">4</button>
          <button type="button" data-pin="5">5</button>
          <button type="button" data-pin="6">6</button>
          <button type="button" data-pin="7">7</button>
          <button type="button" data-pin="8">8</button>
          <button type="button" data-pin="9">9</button>
          <button type="button" data-pin="C">C</button>
          <button type="button" data-pin="0">0</button>
          <button type="button" data-pin="OK">OK</button>
        </div>
        <button id="pin-close" type="button">閉じる</button>
      </div>
    </div>

    <!-- Settings panel -->
    <div id="settings-panel" class="hidden">
      <div id="settings-card">
        <h2>設定</h2>

        <label class="setting-row" for="brightness-slider">
          <span class="setting-label">通常時の明るさ</span>
          <span id="brightness-value" class="setting-value">22</span>
        </label>
        <input id="brightness-slider" class="setting-slider" type="range" min="0" max="100" value="22" step="1" />
        <p class="setting-hint">懐中電灯の明るさ・距離は変わりません</p>

        <label class="setting-row" for="look-sens-slider">
          <span class="setting-label">視点感度</span>
          <span id="look-sens-value" class="setting-value">50</span>
        </label>
        <input id="look-sens-slider" class="setting-slider" type="range" min="10" max="100" value="50" step="1" />
        <p class="setting-hint">低いほどゆっくり、高いほど素早く視点が回ります</p>

        <label class="setting-row" for="move-sens-slider">
          <span class="setting-label">移動スティック感度</span>
          <span id="move-sens-value" class="setting-value">50</span>
        </label>
        <input id="move-sens-slider" class="setting-slider" type="range" min="10" max="100" value="50" step="1" />
        <p class="setting-hint">最大速度は変わりません。倒し始めの反応だけ調整します</p>

        <button id="settings-close" type="button">閉じる</button>
      </div>
    </div>

    <!-- Error overlay -->
    <div id="error-overlay" class="hidden">
      <div id="error-message"></div>
    </div>

    <!-- エンディング / 敗北 -->
    <div id="ending-panel" class="hidden">
      <div id="ending-card">
        <div id="ending-text"></div>
        <button id="ending-retry" type="button" class="hidden">リトライ</button>
        <button id="ending-title" type="button">タイトルへ</button>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading-overlay">
      <div id="loading-text">読み込み中...</div>
    </div>

    <!-- Title screen -->
    <div id="title-screen">
      <div id="title-inner">
        <p id="title-sub">『同じ廊下』</p>
        <h1 id="title-logo">同じ廊下</h1>
        <button id="btn-start" type="button" class="title-btn">ゲーム開始</button>
        <button id="btn-howto" type="button" class="title-btn title-btn-secondary">操作説明</button>
        <button id="btn-settings-title" type="button" class="title-btn title-btn-secondary">設定</button>
      </div>
    </div>

    <!-- How-to panel -->
    <div id="howto-panel" class="hidden">
      <div id="howto-card">
        <h2>操作説明</h2>
        <ul id="howto-list">
          <li><strong>移動</strong> … 画面左下のスティックで前後左右に移動</li>
          <li><strong>視点</strong> … 画面右側をスワイプして見回す</li>
          <li><strong>調べる</strong> … 対象に近づくと右下にボタンが表示される</li>
          <li><strong>設定</strong> … 右上の ⚙ から明るさ・感度を変更</li>
        </ul>
        <button id="howto-back" type="button">戻る</button>
      </div>
    </div>

    <!-- 導入ストーリー -->
    <div id="intro-overlay" class="hidden">
      <div id="intro-text"></div>
      <div id="intro-hint">タップして進む</div>
    </div>

    <!-- ループ暗転 -->
    <div id="fade-overlay" class="hidden"></div>
  </div>

  <!-- Three.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
