<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>同じ廊下</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Virtual Joystick (left) -->
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>

    <!-- Settings button (top-right, safe area) -->
    <button id="settings-btn" type="button" aria-label="設定">⚙</button>

    <!-- 調査 / 開ける アクションボタン（右下寄り・スティックと重ならない） -->
    <button id="action-btn" type="button" class="hidden" aria-label="調べる">調べる</button>

    <!-- 調査メッセージ -->
    <div id="message-panel" class="hidden">
      <div id="message-text"></div>
      <button id="message-close" type="button">閉じる</button>
    </div>

    <!-- Settings panel -->
    <div id="settings-panel" class="hidden">
      <div id="settings-card">
        <h2>設定</h2>

        <label class="setting-row" for="brightness-slider">
          <span class="setting-label">通常時の明るさ</span>
          <span id="brightness-value" class="setting-value">65</span>
        </label>
        <input id="brightness-slider" class="setting-slider" type="range" min="0" max="100" value="65" step="1" />
        <p class="setting-hint">懐中電灯の明るさ・距離は変わりません</p>

        <label class="setting-row" for="look-sens-slider">
          <span class="setting-label">視点感度</span>
          <span id="look-sens-value" class="setting-value">50</span>
        </label>
        <input id="look-sens-slider" class="setting-slider" type="range" min="10" max="100" value="50" step="1" />
        <p class="setting-hint">低いほどゆっくり、高いほど素早く視点が回ります</p>

        <label class="setting-row" for="move-sens-slider">
          <span class="setting-label">移動スティック感度</span>
          <span id="move-sens-value" class="setting-value">50</span>
        </label>
        <input id="move-sens-slider" class="setting-slider" type="range" min="10" max="100" value="50" step="1" />
        <p class="setting-hint">最大速度は変わりません。倒し始めの反応だけ調整します</p>

        <button id="settings-close" type="button">閉じる</button>
      </div>
    </div>

    <!-- Error overlay -->
    <div id="error-overlay" class="hidden">
      <div id="error-message"></div>
    </div>

    <!-- Loading -->
    <div id="loading-overlay">
      <div id="loading-text">読み込み中...</div>
    </div>
  </div>

  <!-- Three.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
